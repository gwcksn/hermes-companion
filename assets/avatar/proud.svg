<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Hermes feeling proud" style="overflow: visible">
<style>
.g{transform-box:fill-box;transform-origin:50% 100%}
.c{transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bobfast{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes thinktilt{0%,100%{transform:rotate(2deg)}50%{transform:rotate(7deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.05)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.06,0.92)}45%{transform:translateY(-22px) scale(0.96,1.06)}75%{transform:translateY(0) scale(1.05,0.94)}}
@keyframes shake{0%,60%,100%{transform:translateX(0)}65%{transform:translateX(-3px)}70%{transform:translateX(3px)}75%{transform:translateX(-3px)}80%{transform:translateX(3px)}85%{transform:translateX(-2px)}90%{transform:translateX(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes look{0%,30%,100%{transform:translateX(0)}38%,55%{transform:translateX(-4px)}63%,80%{transform:translateX(4px)}}
@keyframes wingL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(10deg)}}
@keyframes wingR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-10deg)}}
@keyframes ring{0%{opacity:0.5;transform:scale(0.96)}100%{opacity:0;transform:scale(1.08)}}
@keyframes dot{0%,60%,100%{opacity:0.25}20%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes code{0%{transform:scaleX(0.25)}60%,100%{transform:scaleX(1)}}
@keyframes sweep{0%{transform:translateX(-26px)}100%{transform:translateX(26px)}}
@keyframes follow{0%{transform:translateX(-4px)}100%{transform:translateX(4px)}}
@keyframes talk{0%{transform:scaleY(0.25)}100%{transform:scaleY(1)}}
@keyframes arcr{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(6px)}}
@keyframes arcl{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(-6px)}}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes pop{0%,10%{transform:scale(0)}22%{transform:scale(1.2)}30%,85%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{transform:translateY(16px);opacity:0}100%{transform:translateY(16px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes zfloat{0%{transform:translate(0px,0px);opacity:0}20%{opacity:1}100%{transform:translate(18px,-26px);opacity:0}}
.bob{animation:bob 3.4s ease-in-out infinite}
.bobfast{animation:bobfast 0.5s ease-in-out infinite}
.tilt{animation:tilt 3s ease-in-out infinite}
.thinktilt{animation:thinktilt 3.6s ease-in-out infinite}
.breathe{animation:breathe 4.2s ease-in-out infinite}
.hop{animation:hop 1.4s ease-in-out infinite}
.shake{animation:shake 2.4s ease-in-out infinite}
.blink{animation:blink 5s infinite}
.look{animation:look 9s ease-in-out infinite}
.wl{transform-box:fill-box;transform-origin:100% 50%;animation:wingL 4s ease-in-out infinite}
.wr{transform-box:fill-box;transform-origin:0% 50%;animation:wingR 4s ease-in-out infinite}
.ring{animation:ring 2s ease-out infinite}
.dot{animation:dot 1.2s ease-in-out infinite}
.spin{animation:spin 3s linear infinite}
.code{transform-box:fill-box;transform-origin:0% 50%;animation:code 1.6s ease-in-out infinite}
.sweep{animation:sweep 1.8s ease-in-out infinite alternate}
.follow{animation:follow 1.8s ease-in-out infinite alternate}
.talk{animation:talk 0.4s ease-in-out infinite alternate}
.arcr{animation:arcr 1.2s ease-out infinite}
.arcl{animation:arcl 1.2s ease-out infinite}
.twinkle{animation:twinkle 1.6s ease-in-out infinite}
.pop{animation:pop 2.8s ease-in-out infinite}
.drip{animation:drip 1.6s ease-in infinite}
.pulse{animation:pulse 0.8s ease-in-out infinite}
.zf{animation:zfloat 3.2s ease-in infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes heart{0%{transform:translateY(10px) scale(0.6);opacity:0}20%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
@keyframes jit{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes ringclk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes ringarc{0%,100%{opacity:1}50%{opacity:0.15}}
@keyframes notefloat{0%{transform:translate(0px,10px) rotate(0deg);opacity:0}15%{opacity:1}100%{transform:translate(10px,-34px) rotate(15deg);opacity:0}}
@keyframes sing{0%{transform:scaleY(0.5)}100%{transform:scaleY(1)}}
.sway{animation:sway 1.6s ease-in-out infinite}
.hf{animation:heart 2.4s ease-out infinite}
.jit{animation:jit 0.1s linear infinite}
.rk{animation:ringclk 0.12s ease-in-out infinite}
.ringarc{animation:ringarc 0.25s steps(1) infinite}
.nt{animation:notefloat 2.4s ease-out infinite}
.sing{animation:sing 0.8s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.g,.c,.wl,.wr,.code,.sweep,.follow,.talk,.zf,.drip{animation:none}}

/* idle-activities */
@keyframes sip{0%,12%,78%,100%{transform:translate(0,0) rotate(0deg)}30%,58%{transform:translate(0,-14px) rotate(-5deg)}}
@keyframes steam{0%{transform:translateY(3px);opacity:0}30%{opacity:0.8}100%{transform:translateY(-6px);opacity:0}}
@keyframes scan{0%,8%{transform:translateX(-6px)}46%,54%{transform:translateX(6px)}60%,100%{transform:translateX(-6px)}}
@keyframes flip{0%,55%{transform:scaleX(1);opacity:1}78%{transform:scaleX(-1);opacity:1}92%{transform:scaleX(-1);opacity:0}100%{transform:scaleX(1);opacity:0}}
@keyframes starfall{0%,62%{transform:translate(0,0);opacity:0}68%{opacity:1}92%,100%{transform:translate(-62px,48px);opacity:0}}
@keyframes lookup{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shadowfloat{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(0.78);opacity:0.22}}
@keyframes aura{0%,100%{transform:scale(0.96);opacity:0.14}50%{transform:scale(1.08);opacity:0.28}}
@keyframes orb{0%{transform:translateY(0);opacity:0}20%{opacity:0.9}100%{transform:translateY(-44px);opacity:0}}
@keyframes mash{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
@keyframes gamehero{0%{transform:translateX(0)}50%{transform:translateX(38px)}100%{transform:translateX(0)}}
@keyframes gameenemy{0%{transform:translateX(0)}100%{transform:translateX(-14px)}}
@keyframes tongue{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes draw{0%{stroke-dashoffset:90;opacity:1}40%,80%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes draw2{0%,35%{stroke-dashoffset:60;opacity:1}65%,80%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes pencil{0%{transform:translate(-14px,6px) rotate(-6deg)}20%{transform:translate(8px,-6px) rotate(4deg)}40%{transform:translate(6px,8px) rotate(-3deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(14px,6px) rotate(5deg)}100%{transform:translate(-14px,6px) rotate(-6deg)}}
@keyframes st-body{0%,22%,100%{transform:scale(1,1) rotate(0deg)}38%,66%{transform:scale(0.95,1.1) rotate(0deg)}76%{transform:scale(1.03,0.97) rotate(0deg)}82%{transform:scale(1,1) rotate(-3deg)}86%{transform:scale(1,1) rotate(3deg)}90%{transform:scale(1,1) rotate(-2deg)}94%{transform:scale(1,1) rotate(0deg)}}
@keyframes st-wl{0%,22%,76%,100%{transform:translate(0,0) rotate(0deg) scale(1)}38%,66%{transform:translate(-8px,-18px) rotate(42deg) scale(1.25)}}
@keyframes st-wr{0%,22%,76%,100%{transform:translate(0,0) rotate(0deg) scale(1)}38%,66%{transform:translate(8px,-18px) rotate(-42deg) scale(1.25)}}
@keyframes st-open{0%,30%,74%,100%{opacity:1}34%,70%{opacity:0}}
@keyframes st-shut{0%,30%,74%,100%{opacity:0}34%,70%{opacity:1}}
@keyframes cycle{0%{opacity:0;transform:scale(0.6)}5%{opacity:1;transform:scale(1)}28%{opacity:1;transform:scale(1)}33%,100%{opacity:0;transform:scale(0.6)}}
@keyframes daydrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes peek{0%,18%{transform:translate(0,0)}26%,60%{transform:translate(7px,-7px)}70%,100%{transform:translate(0,0)}}
@keyframes peeknod{0%,68%,100%{transform:rotate(0deg) translateY(0)}74%{transform:rotate(0deg) translateY(5px)}80%{transform:rotate(0deg) translateY(0)}86%{transform:rotate(0deg) translateY(4px)}92%{transform:rotate(0deg) translateY(0)}}
.sip{animation:sip 5s ease-in-out infinite}
.steam{animation:steam 2.2s ease-out infinite}
.scan{animation:scan 5s ease-in-out infinite}
.flip{transform-box:fill-box;transform-origin:0% 50%;animation:flip 6s ease-in-out infinite}
.starfall{animation:starfall 7s ease-in infinite}
.lookup{animation:lookup 6s ease-in-out infinite}
.levitate{animation:levitate 5s ease-in-out infinite}
.shadowfloat{transform-box:fill-box;transform-origin:center;animation:shadowfloat 5s ease-in-out infinite}
.aura{animation:aura 5s ease-in-out infinite}
.orb{animation:orb 5s ease-out infinite}
.mash{animation:mash 0.22s linear infinite}
.gamehero{animation:gamehero 3s ease-in-out infinite}
.gameenemy{animation:gameenemy 1.2s linear infinite alternate}
.tongue{animation:tongue 0.4s ease-in-out infinite}
.draw{stroke-dasharray:90;animation:draw 6s ease-in-out infinite}
.draw2{stroke-dasharray:60;animation:draw2 6s ease-in-out infinite}
.pencil{animation:pencil 6s ease-in-out infinite}
.st-body{animation:st-body 6s ease-in-out infinite}
.st-wl{transform-box:fill-box;transform-origin:100% 50%;animation:st-wl 6s ease-in-out infinite}
.st-wr{transform-box:fill-box;transform-origin:0% 50%;animation:st-wr 6s ease-in-out infinite}
.st-open{animation:st-open 6s steps(1) infinite}
.st-shut{animation:st-shut 6s steps(1) infinite}
.cycle{transform-box:fill-box;transform-origin:center;animation:cycle 7.5s ease-in-out infinite}
.daydrift{animation:daydrift 4s ease-in-out infinite}
.peek{animation:peek 8s ease-in-out infinite}
.peeknod{animation:peeknod 8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sip,.steam,.scan,.flip,.starfall,.lookup,.levitate,.shadowfloat,.aura,.orb,.mash,.gamehero,.gameenemy,.tongue,.draw,.draw2,.pencil,.st-body,.st-wl,.st-wr,.cycle,.daydrift,.peek,.peeknod{animation:none}}

/* pet-reactions */
@keyframes qmbob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-5px) rotate(8deg)}}
@keyframes curtilt{0%,100%{transform:rotate(-2deg)}40%,70%{transform:rotate(9deg)}}
@keyframes slump{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(3px) scale(1.03,0.95)}}
@keyframes sigh{0%,55%{transform:translate(0,0) scale(0.4);opacity:0}65%{opacity:0.9}100%{transform:translate(14px,-12px) scale(1.2);opacity:0}}
@keyframes pride{0%,100%{transform:translateY(0) scale(1,1) rotate(-2deg)}50%{transform:translateY(-3px) scale(1.04,1.04) rotate(-2deg)}}
@keyframes sulkysway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-7deg)}}
@keyframes huff{0%,60%{transform:translate(0,0) scale(0.4);opacity:0}70%{opacity:0.85}100%{transform:translate(12px,-6px) scale(1.15);opacity:0}}
@keyframes ballx{0%{transform:translateX(-46px)}100%{transform:translateX(46px)}}
@keyframes ballbounce{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-26px)}}
@keyframes ballspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes feedcard{0%{transform:translate(48px,-50px) scale(1) rotate(14deg);opacity:0}10%{opacity:1}52%{transform:translate(0,0) scale(0.4) rotate(0deg);opacity:1}58%,100%{transform:translate(0,0) scale(0) rotate(0deg);opacity:0}}
@keyframes chomp{0%,40%,100%{transform:scaleY(0.25)}52%{transform:scaleY(1)}62%{transform:scaleY(0.3)}72%{transform:scaleY(0.8)}84%{transform:scaleY(0.25)}}
@keyframes feedglow{0%,100%{opacity:0.25}50%{opacity:0.5}}
.qm{transform-box:fill-box;transform-origin:center;animation:qmbob 1.8s ease-in-out infinite}
.curtilt{animation:curtilt 4.5s ease-in-out infinite}
.slump{animation:slump 5s ease-in-out infinite}
.sigh{transform-box:fill-box;transform-origin:center;animation:sigh 5s ease-out infinite}
.pride{animation:pride 2.6s ease-in-out infinite}
.sulkysway{animation:sulkysway 3.4s ease-in-out infinite}
.huff{transform-box:fill-box;transform-origin:center;animation:huff 3.4s ease-out infinite}
.ballx{animation:ballx 2.4s ease-in-out infinite alternate}
.ballbounce{animation:ballbounce 1.2s ease-out infinite}
.ballspin{transform-box:fill-box;transform-origin:center;animation:ballspin 1s linear infinite}
.feedcard{transform-box:fill-box;transform-origin:center;animation:feedcard 3s ease-in infinite}
.chomp{transform-box:fill-box;transform-origin:50% 30%;animation:chomp 3s ease-in-out infinite}
.feedglow{animation:feedglow 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.qm,.curtilt,.slump,.sigh,.pride,.sulkysway,.huff,.ballx,.ballbounce,.ballspin,.feedcard,.chomp,.feedglow{animation:none}}
</style>
