<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none}
input::placeholder{color:#8C879A}
input:focus{outline:2px solid #8FE3C0;outline-offset:2px}
a:focus-visible{outline:2px solid #8FE3C0;outline-offset:2px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes talk{0%{transform:scaleY(0.25)}100%{transform:scaleY(1)}}
@keyframes arcr{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(6px)}}
@keyframes arcl{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(-6px)}}
.bob{animation:bob 1.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.talk{transform-box:fill-box;transform-origin:center;animation:talk 0.4s ease-in-out infinite alternate}
.arcr{animation:arcr 1.2s ease-out infinite}
.arcl{animation:arcl 1.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.blink,.talk,.arcr,.arcl{animation:none}}
</style>
</helmet>
